name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.install-profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        install-profile: ["dev", "dev,geospatial"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[${{ matrix.install-profile }}]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Parser benchmark
        if: always()
        run: python -m benchmarks.technical_description --subset ci --output .benchmark-results/td-ci.json
      - name: Upload parser benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-benchmark-${{ matrix.python-version }}-${{ matrix.install-profile }}
          path: .benchmark-results/td-ci.json
          if-no-files-found: ignore

