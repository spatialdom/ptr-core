[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ptr-core"
version = "0.1.1"
description = "Reference Python engine for Parcel Truth Records v0.1."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Spatialdom" }
]
maintainers = [
  { name = "Spatialdom" }
]
license = "MIT"
keywords = ["cadastre", "gis", "parcel", "ptr", "survey"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/spatialdom/ptr-core"
Issues = "https://github.com/spatialdom/ptr-core/issues"
Source = "https://github.com/spatialdom/ptr-core"
Specification = "https://github.com/spatialdom/ptr"

[project.optional-dependencies]
geospatial = ["pyproj>=3.6", "shapely>=2.0"]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ptr_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ptr_core"]

[[tool.mypy.overrides]]
module = ["pyproj.*", "shapely.*"]
ignore_missing_imports = true
