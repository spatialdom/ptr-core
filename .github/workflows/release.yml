name: Release artifacts

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release_smoke.py
      - scripts/verify_release.py
      - pyproject.toml
      - RELEASE_NOTES_*.md
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package version from reviewed main
        type: boolean
        default: false

concurrency:
  group: ptr-core-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release tools
        run: python -m pip install ".[dev,geospatial,release]"
      - name: Resolve version and require a reviewed publication commit
        id: version
        env:
          PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_TAG=$(python -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -f "RELEASE_NOTES_$RELEASE_TAG.md"
          if [ "$PUBLISH" = true ]; then
            git merge-base --is-ancestor HEAD origin/main
            if [ "$REF_TYPE" = tag ]; then
              test "$REF_NAME" = "$RELEASE_TAG"
            else
              test "$REF_NAME" = main
              test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            fi
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Lint and type-check release source
        run: |
          ruff check .
          mypy
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify distributions and both installation profiles
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/verify_release.py --tag "$REF_NAME"
          else
            python scripts/verify_release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Tag reviewed commit and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$RELEASE_TAG" -m "PTR Core $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag \
            --title "PTR Core $RELEASE_TAG" \
            --notes-file "RELEASE_NOTES_$RELEASE_TAG.md"
      - name: Verify anonymous download and installed public wheel
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          mkdir public-release
          cd public-release
          VERSION=${RELEASE_TAG#v}
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          for ASSET in SHA256SUMS "ptr_core-$VERSION-py3-none-any.whl" "ptr_core-$VERSION.tar.gz"; do
            curl --fail --location --retry 5 --retry-all-errors --output "$ASSET" "$BASE_URL/$ASSET"
          done
          sha256sum --check SHA256SUMS
          for PROFILE in base geospatial; do
            python -m venv "$RUNNER_TEMP/public-$PROFILE"
            PYTHON="$RUNNER_TEMP/public-$PROFILE/bin/python"
            WHEEL="$PWD/ptr_core-$VERSION-py3-none-any.whl"
            if [ "$PROFILE" = geospatial ]; then
              WHEEL="$WHEEL[geospatial]"
            fi
            "$PYTHON" -m pip install "$WHEEL"
            "$PYTHON" ../scripts/release_smoke.py "$VERSION" "$PROFILE"
          done
